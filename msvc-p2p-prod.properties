# APPLICATION METADATA
spring.application.name=msvc-p2p
server.port=${PORT:8001}

# DATABASE CONFIGURATION (RAILWAY - PROD)
# Estas 3 variables deben existir como Variables de entorno en el servicio
# msvc-p2p dentro de Railway, apuntando al servicio Postgres del proyecto.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / HIBERNATE CONFIGURATION
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Bank BNC Configuration
bnc.api.client-id=d0822f08-ea33-4eef-a8c7-bb69561694f0
bnc.api.master-key=c423c4d6ef0322baabb0d0fce487b438
bnc.api.url-base=https://servicios.bncenlinea.com:16500

# LOGGING DEBUG (PARA DETECTAR ERRORES DE CONEXIÓN)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.jdbc.datasource=DEBUG

# --- OTRAS CONFIGURACIONES ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Eureka Configuration
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL}
eureka.instance.prefer-ip-address=true

# RabbitMQ Configuration
# Configuración coherente con el nombre del servicio RabbitMQ en Railway
spring.rabbitmq.host=${RAILWAY_INTERNAL_DOMAIN}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_DEFAULT_USER}
spring.rabbitmq.password=${RABBITMQ_DEFAULT_PASS}

# Reintentos y Tiempos de espera
spring.rabbitmq.template.reply-timeout=5000
spring.rabbitmq.connection-timeout=10000

# Messaging SDK Generic Configuration
messaging.sdk.rabbit.queue-name=notification.queue
messaging.sdk.rabbit.exchange-name=notification.exchange
messaging.sdk.rabbit.routing-key=notification.payment.received
messaging.sdk.rabbit.dead-letter-exchange=notification.exchange.dlx
messaging.sdk.rabbit.dead-letter-routing-key=notification.dead.letter

# ==========================================
# SPRING ACTUATOR & HEALTH CHECKS
# ==========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.db.enabled=true

# 1. Endpoint para el Dashboard (Limpio y rápido)
management.endpoint.health.group.monitor.include=db,rabbit,ping
management.endpoint.health.group.monitor.show-details=never

# BNC Webhook Security (V2.0)
bnc.webhook.api-key=bnc-secure-key-2026
bnc.webhook.user=bnc_user
bnc.webhook.password=bnc_pass_2026
bnc.webhook.jwt-secret=bnc_jwt_secret_key_fixed_for_demo

# Reconciliacion activa P2P (hallazgo-timeout-p2p-transaccion-huerfana.md):
# en vez de esperar solo el webhook, este job consulta activamente a BNC el
# estado de cualquier transaccion que lleve demasiado tiempo sin confirmar.
p2p.reconciliation.enabled=true
p2p.reconciliation.interval-ms=300000
p2p.reconciliation.stuck-after-minutes=20
p2p.reconciliation.max-attempts=5

