spring.application.name=eureka-server
server.port=${PORT:8761}

# En entornos distribuidos, podrías querer tener varios Eurekas (Peer Awareness)
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=prod-eureka-server
|
# Volvemos a activar la auto-preservación para mayor estabilidad
eureka.server.enable-self-preservation=true
eureka.server.renewal-percent-threshold=0.85

# CORS para los endpoints de Actuator (health, etc.) — sin esto, el
# navegador ve "Failed to fetch" en cualquier dashboard que consulte este
# servicio desde otro origen (ej. bnc-payment-monitor), aunque el servicio
# este sano. Ver msvc-p2p (CorsFilter a nivel Servlet) para el mismo fix
# aplicado directamente en codigo en los microservicios donde si tenemos
# acceso al repo.
management.endpoints.web.cors.allowed-origins=*
management.endpoints.web.cors.allowed-methods=GET
